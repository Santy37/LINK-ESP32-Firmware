; PlatformIO config for the ESP32-S3 firmware build/upload setup.
[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; serial
monitor_speed = 115200
monitor_port  = COM3
upload_speed  = 921600
upload_port   = COM3

; use native USB serial on S3
board_upload.use_1200bps_touch   = true
board_upload.wait_for_upload_port = true

; needed for N32R16V (32MB flash + 16MB psram)
board_build.arduino.memory_type = opi_opi

; default partition table is fine for now
board_build.partitions = default.csv

; libs (match HAS_* flags in include/config.h)
lib_deps =
  adafruit/Adafruit BNO055@^1.6.1          ; 9-DOF IMU        (HAS_IMU=1)
  adafruit/Adafruit Unified Sensor@^1.1.9  ;                  (HAS_IMU=1)
  adafruit/Adafruit BMP280 Library@^2.6.8  ; Barometer        (HAS_BARO=1)
  mikalhart/TinyGPSPlus@^1.0.3             ; GNSS parser      (HAS_GNSS=1)
  bblanchon/ArduinoJson@^7.1.0             ; JSON serialisation
  adafruit/Adafruit SSD1306@^2.5.7         ; OLED 128x32      (HAS_OLED=1)
  adafruit/Adafruit GFX Library@^1.11.9    ; GFX dependency
  bodmer/TFT_eSPI@^2.5.43                  ; ST7735 1.8" TFT  (HAS_TFT=1)

; build flags
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  ; ── TFT_eSPI configuration (ST7735 1.8" 128x160) ──────────────
  ; Define USER_SETUP_LOADED=1 so TFT_eSPI ignores its own User_Setup.h
  ; and uses these flags instead — keeps the config in-tree.
  -DUSER_SETUP_LOADED=1
  -DST7735_DRIVER=1
  -DTFT_WIDTH=128
  -DTFT_HEIGHT=160
  ; Tab variant: GREENTAB128 is the most common for generic 1.8" red PCBs
  ; with 128x160 panels. If you see a colored pixel border or shifted image,
  ; swap to one of: ST7735_GREENTAB / ST7735_REDTAB / ST7735_BLACKTAB /
  ; ST7735_GREENTAB128 / ST7735_GREENTAB160x80 / ST7735_REDTAB160x80.
  -DST7735_GREENTAB2
  ; If colors look swapped (red↔blue), comment this line out:
  -DTFT_RGB_ORDER=TFT_BGR
  ; pin map (must match cfg::TFT_PIN_* in include/config.h)
  -DTFT_MISO=-1
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=14
  -DTFT_RST=15
  -DTFT_BL=-1
  ; fonts
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  ; SPI clock (27 MHz is safe; bump to 40 MHz once stable)
  -DSPI_FREQUENCY=27000000
  ; force HSPI on ESP32-S3 (VSPI is reserved for internal flash)
  -DUSE_HSPI_PORT
